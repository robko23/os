# Lenovo Yoga 7 14ITL5: the BIOS hides S3 (deep) sleep by setting SS3 = Zero in
# the DSDT ("Modern Standby" / s2idle only). Override the DSDT from the
# initramfs with a patched copy (SS3 = One) so deep sleep becomes available.
#
# Only built into the ntb image (build.sh gates on MACHINE=ntb; see Taskfile).
# The table is generated by scripts/dsdt/ in the OS repo; after a BIOS update
# it must be re-extracted and re-patched. dsdt-override-check.service warns at
# boot when that is needed. Requires Secure Boot / kernel lockdown to be off.
acpi_override="yes"
acpi_table_dir="/etc/dracut.conf.d/yoga7i-acpi"